name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Run ruff (errors + pyflakes only)
        run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install traceability dependencies
        run: pip install -r services/traceability/requirements.txt

      - name: Install rescue dependencies
        run: pip install -r services/rescue/requirements.txt

      - name: Run traceability tests
        working-directory: services/traceability
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

      - name: Run metrology tests
        working-directory: services/metrology
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

      - name: Run rescue tests
        working-directory: services/rescue
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  docker-build:
    name: Docker build (traceability + rescue)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build traceability image
        run: docker build -t earthward-traceability:ci services/traceability
      - name: Build rescue image
        run: docker build -t earthward-rescue:ci services/rescue
      - name: Smoke-test containers boot and pass health checks
        run: |
          docker run -d --name trace -p 5000:5000 -e ALLOW_UNAUTHENTICATED=true earthward-traceability:ci
          docker run -d --name rescue -p 5001:5001 -e ALLOW_UNAUTHENTICATED=true earthward-rescue:ci
          for i in $(seq 1 15); do curl -sf http://localhost:5000/health && break || sleep 1; done
          curl -sf http://localhost:5000/health
          for i in $(seq 1 15); do curl -sf http://localhost:5001/health && break || sleep 1; done
          curl -sf http://localhost:5001/health
          docker logs trace
          docker logs rescue
          docker stop trace rescue
